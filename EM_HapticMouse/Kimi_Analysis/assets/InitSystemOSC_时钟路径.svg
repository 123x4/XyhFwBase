<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 34px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #0F172A; }
      .subtitle { font: 20px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .stage { font: 700 21px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #FFFFFF; }
      .body { font: 18px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #1E293B; }
      .code { font: 17px 'Noto Sans Mono CJK SC','Consolas',monospace; fill: #0F172A; }
      .small { font: 15px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #64748B; }
      .calltitle { font: 700 22px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #0F172A; }
      .callbody { font: 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="1600" height="820" fill="#F8FAFC"/>
  <text x="40" y="55" class="title">InitSystemOSC：12 MHz 晶振如何变成 48 MHz 系统时钟</text>
  <text x="40" y="92" class="subtitle">主线：准备振荡器 → 选择 PLL 输入 → 配置并锁定 PLL → 切换主时钟 → AHB 分频与外设门控</text>
  <rect x="40" y="120" width="1520" height="58" rx="12" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="65" y="157" class="body">进入前：复位后主时钟来自 IRC（12 MHz）　　→　　返回后：PLL 输出 48 MHz，AHB ÷ 1，系统时钟 48 MHz</text>

  <rect x="40" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <path d="M40 229 Q40 215 54 215 H246 Q260 215 260 229 V263 H40 Z" fill="#2563EB"/>
  <text x="60" y="247" class="stage">① 系统振荡器</text>
  <text x="58" y="293" class="body">外部晶振：12 MHz</text>
  <text x="58" y="330" class="code">SYSOSCCTRL</text>
  <text x="58" y="357" class="code">FREQRANGE = 0</text>
  <text x="58" y="384" class="body">选择 1～20 MHz</text>
  <text x="58" y="423" class="code">PDRUNCFG[5] = 0</text>
  <text x="58" y="450" class="body">振荡器上电并短等待</text>
  <text x="58" y="500" class="small">src/OSC.c:34-36</text>

  <rect x="300" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#818CF8" stroke-width="2"/>
  <path d="M300 229 Q300 215 314 215 H506 Q520 215 520 229 V263 H300 Z" fill="#4F46E5"/>
  <text x="320" y="247" class="stage">② 选择 PLL 输入</text>
  <text x="318" y="302" class="code">SYSPLLCLKSEL = 1</text>
  <text x="318" y="334" class="body">选择 SYSOSC</text>
  <text x="318" y="375" class="code">SYSPLLCLKUEN</text>
  <text x="318" y="407" class="code">1 → 0 → 1</text>
  <text x="318" y="444" class="body">确认输入选择生效</text>
  <text x="318" y="500" class="small">src/OSC.c:38-42</text>

  <rect x="560" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
  <path d="M560 229 Q560 215 574 215 H766 Q780 215 780 229 V263 H560 Z" fill="#7C3AED"/>
  <text x="580" y="247" class="stage">③ 配置 PLL</text>
  <text x="578" y="300" class="code">SYSPLLCTRL = 0x23</text>
  <text x="578" y="337" class="code">MSEL=3 → M=4</text>
  <text x="578" y="369" class="code">PSEL=1 → P=2</text>
  <text x="578" y="411" class="body">12 × 4 = 48 MHz</text>
  <text x="578" y="447" class="body">FCCO = 192 MHz</text>
  <text x="578" y="500" class="small">src/OSC.c:44</text>

  <rect x="820" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#F472B6" stroke-width="2"/>
  <path d="M820 229 Q820 215 834 215 H1026 Q1040 215 1040 229 V263 H820 Z" fill="#DB2777"/>
  <text x="840" y="247" class="stage">④ 启动并等锁</text>
  <text x="838" y="300" class="code">PDRUNCFG[7] = 0</text>
  <text x="838" y="332" class="body">PLL 上电</text>
  <text x="838" y="373" class="code">SYSPLLSTAT[0]</text>
  <text x="838" y="405" class="body">等待 LOCK = 1</text>
  <text x="838" y="447" class="body">CPU 此时尚未切换</text>
  <text x="838" y="500" class="small">src/OSC.c:45-46</text>

  <rect x="1080" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#FB923C" stroke-width="2"/>
  <path d="M1080 229 Q1080 215 1094 215 H1286 Q1300 215 1300 229 V263 H1080 Z" fill="#EA580C"/>
  <text x="1100" y="247" class="stage">⑤ 切换主时钟</text>
  <text x="1098" y="300" class="code">MAINCLKSEL = 3</text>
  <text x="1098" y="332" class="body">选择 PLL 输出</text>
  <text x="1098" y="373" class="code">MAINCLKUEN</text>
  <text x="1098" y="405" class="code">1 → 0 → 1</text>
  <text x="1098" y="447" class="body">主时钟变为 48 MHz</text>
  <text x="1098" y="500" class="small">src/OSC.c:48-52</text>

  <rect x="1340" y="215" width="220" height="310" rx="14" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>
  <path d="M1340 229 Q1340 215 1354 215 H1546 Q1560 215 1560 229 V263 H1340 Z" fill="#059669"/>
  <text x="1358" y="247" class="stage">⑥ 分频与门控</text>
  <text x="1358" y="296" class="code">SYSAHBCLKDIV = 1</text>
  <text x="1358" y="330" class="body">48 ÷ 1 = 48 MHz</text>
  <text x="1358" y="369" class="code">SYSAHBCLKCTRL</text>
  <text x="1358" y="397" class="code">bit 16 = 1</text>
  <text x="1358" y="434" class="body">开启 IOCON 时钟</text>
  <text x="1358" y="500" class="small">src/OSC.c:54-55</text>

  <line x1="264" y1="370" x2="292" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="524" y1="370" x2="552" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="784" y1="370" x2="812" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1044" y1="370" x2="1072" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1304" y1="370" x2="1332" y2="370" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="40" y="565" width="740" height="172" rx="14" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="65" y="603" class="calltitle">记忆关键：准备和切换是两件事</text>
  <text x="65" y="642" class="callbody">①～④：只准备新的时钟，CPU 仍沿用原主时钟</text>
  <text x="65" y="676" class="callbody">⑤：PLL 锁定后，才把主时钟切到 PLL 输出</text>
  <text x="65" y="710" class="callbody">⑥：最后设置 AHB 分频，并打开 IOCON 时钟</text>

  <rect x="820" y="565" width="740" height="172" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="845" y="603" class="calltitle">两个反直觉点</text>
  <text x="845" y="642" class="callbody">PDRUNCFG：写 0 = 上电，写 1 = 掉电</text>
  <text x="845" y="676" class="callbody">UEN：先写 0 再写 1，时钟源选择才更新</text>
  <text x="845" y="710" class="callbody">代码写 1→0→1，是为了确保出现 0→1</text>

  <text x="40" y="785" class="small">参数来源：inc/OSC.h:10-18；寄存器依据：UM10462 第 3.5 节与第 3.10 节。图中 12 MHz 是代码配置所假定的外部晶振频率。</text>
</svg>
